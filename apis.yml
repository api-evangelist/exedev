name: exe.dev
description: >-
  exe.dev is a cloud computing platform from Bold Software that provisions Linux VMs
  with persistent disks, instant HTTPS, and built-in authentication — all managed over
  SSH ("just use ssh"). It offers disposable Sandboxes for running AI-generated code,
  persistent VPS-style VMs, and Devbox cloud development environments, each reachable at
  https://<vm>.exe.xyz with automatic TLS. A companion HTTPS API (POST /exec) runs the
  same command surface with exe1. bearer tokens, and Shelley — a first-party, web-based
  coding agent — runs inside the VMs. exe.dev raised a $35M Series A and is backed by
  Amplify Partners. This profile was enriched by the API Evangelist pipeline from the
  provider's public docs, llms.txt, GitHub org (boldsoftware), and well-known surface.
